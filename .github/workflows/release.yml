name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: TidyFiles v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## TidyFiles v${{ steps.get_version.outputs.VERSION }}

            ### Downloads
            - **Windows**: MSI Installer or NSIS Setup
            - **macOS**: DMG (Apple Silicon & Intel)
            - **Linux**: AppImage, Deb, or RPM

            ### Installation

            #### Windows
            1. Download either the `.msi` or `-setup.exe` file
            2. Run the installer
            3. Follow the installation wizard

            #### macOS
            1. Download the `.dmg` file
            2. Open the DMG and drag TidyFiles to Applications
            3. Right-click the app and select "Open" (first launch only)

            #### Linux
            1. **AppImage**: Download, make executable (`chmod +x`), and run
            2. **Deb**: `sudo dpkg -i tidyfiles_*.deb`
            3. **RPM**: `sudo rpm -i tidyfiles-*.rpm`

            ### System Requirements
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.13 (High Sierra) or later
            - **Linux**: Modern Linux distribution with GTK 3.0+

            ### Features
            - 📁 File organization with custom rules and conditions
            - ☑️ Batch file selection for selective organization
            - 🧪 Dry run mode for testing rules
            - 🏷️ Custom placeholders for file patterns (dates, size, metadata)
            - 🔍 Duplicate file finder with hash-based detection
            - 📜 Operation history with rollback support
            - 🔎 Search and filter across all views
            - ⚙️ Settings management with themes and defaults
            - 🎨 Dark/Light theme support
            - ⚡ Comprehensive error handling and logging
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== MSI files ==="
          ls -la src-tauri/target/release/bundle/msi/ || echo "No MSI files"
          echo "=== NSIS files ==="
          ls -la src-tauri/target/release/bundle/nsis/ || echo "No NSIS files"

      - name: Upload MSI Installer
        shell: bash
        run: |
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -name "*.msi" -type f | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$MSI_FILE" --clobber
          else
            echo "No MSI file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS Setup
        shell: bash
        run: |
          NSIS_FILE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -type f | head -n 1)
          if [ -n "$NSIS_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$NSIS_FILE" --clobber
          else
            echo "No NSIS file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Universal)
        run: pnpm tauri build --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== DMG files ==="
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/ || echo "No DMG files"

      - name: Upload DMG
        shell: bash
        run: |
          DMG_FILE=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$DMG_FILE" --clobber
          else
            echo "No DMG file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== AppImage files ==="
          ls -la src-tauri/target/release/bundle/appimage/ || echo "No AppImage files"
          echo "=== Deb files ==="
          ls -la src-tauri/target/release/bundle/deb/ || echo "No Deb files"

      - name: Upload AppImage
        shell: bash
        run: |
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$APPIMAGE_FILE" --clobber
          else
            echo "No AppImage file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Deb
        shell: bash
        run: |
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$DEB_FILE" --clobber
          else
            echo "No Deb file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-update-manifest:
    name: Generate Update Manifest
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Get release assets
        shell: bash
        run: |
          gh release view v${{ needs.create-release.outputs.version }} --repo wihlarkop/tidyfiles --json assets -q '.assets[].name' > assets.txt
          cat assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update manifest
        shell: bash
        run: |
          # Get asset names
          NSIS_FILE=$(grep -E '.*-setup\.exe$' assets.txt | head -n 1)
          DMG_FILE=$(grep -E '.*\.dmg$' assets.txt | head -n 1)
          APPIMAGE_FILE=$(grep -E '.*\.AppImage$' assets.txt | head -n 1)

          cat > latest.json << EOF
          {
            "version": "${{ needs.create-release.outputs.version }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${NSIS_FILE}",
                "signature": ""
              },
              "darwin-universal": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${DMG_FILE}",
                "signature": ""
              },
              "linux-x86_64": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${APPIMAGE_FILE}",
                "signature": ""
              }
            }
          }
          EOF
          cat latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest
        shell: bash
        run: |
          gh release upload v${{ needs.create-release.outputs.version }} latest.json --clobber --repo wihlarkop/tidyfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
