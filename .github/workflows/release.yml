name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v0.1.0, v1.2.3, etc.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # Disable for release builds (faster)
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse  # Faster dependency fetching
  CARGO_NET_GIT_FETCH_WITH_CLI: true  # Faster git operations

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        run: |
          gh release create v${{ steps.get_version.outputs.VERSION }} \
            --repo wihlarkop/tidyfiles \
            --title "TidyFiles v${{ steps.get_version.outputs.VERSION }}" \
            --notes "## TidyFiles v${{ steps.get_version.outputs.VERSION }}

          ### Downloads
          - **Windows**: MSI or NSIS Setup
          - **macOS**: Universal DMG (Intel + Apple Silicon)
          - **Linux**: AppImage, Deb, or Arch Package

          ### Installation & Documentation
          See the [README](https://github.com/wihlarkop/tidyfiles#-installation) for detailed installation instructions, system requirements, and best practices.

          **Quick Install:**
          - **Windows**: Run the installer
          - **macOS**: Drag to Applications folder
          - **Linux (Arch)**: \`sudo pacman -S webkit2gtk gtk3 && sudo pacman -U tidyfiles-*.pkg.tar.zst\`
          - **Linux (Debian/Ubuntu)**: \`sudo dpkg -i tidyfiles_*.deb\`
          - **Linux (Other)**: Use AppImage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
          shared-key: 'windows-release'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== MSI files ==="
          ls -la src-tauri/target/release/bundle/msi/ || echo "No MSI files"
          echo "=== NSIS files ==="
          ls -la src-tauri/target/release/bundle/nsis/ || echo "No NSIS files"

      - name: Upload MSI Installer
        shell: bash
        run: |
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -name "*.msi" -type f | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$MSI_FILE" --clobber
          else
            echo "No MSI file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS Setup
        shell: bash
        run: |
          NSIS_FILE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -type f | head -n 1)
          if [ -n "$NSIS_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$NSIS_FILE" --clobber
          else
            echo "No NSIS file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    needs: create-release
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
          shared-key: 'macos-release'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (Universal)
        run: pnpm tauri build --ci --target universal-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== DMG files ==="
          ls -la src-tauri/target/universal-apple-darwin/release/bundle/dmg/ || echo "No DMG files"

      - name: Upload DMG
        shell: bash
        run: |
          DMG_FILE=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -type f | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$DMG_FILE" --clobber
          else
            echo "No DMG file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
          shared-key: 'linux-release'

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List generated files (debug)
        shell: bash
        run: |
          echo "=== AppImage files ==="
          ls -la src-tauri/target/release/bundle/appimage/ || echo "No AppImage files"
          echo "=== Deb files ==="
          ls -la src-tauri/target/release/bundle/deb/ || echo "No Deb files"

      - name: Upload AppImage
        shell: bash
        run: |
          APPIMAGE_FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" -type f | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$APPIMAGE_FILE" --clobber
          else
            echo "No AppImage file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Deb
        shell: bash
        run: |
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$DEB_FILE" --clobber
          else
            echo "No Deb file found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Arch Linux package
        shell: bash
        run: |
          # Create package directory structure
          PKG_NAME="tidyfiles"
          PKG_VERSION="${{ needs.create-release.outputs.version }}"
          PKG_DIR="${PKG_NAME}-${PKG_VERSION}"

          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/pixmaps"

          # Copy binary to lib directory
          mkdir -p "${PKG_DIR}/usr/lib/tidyfiles"
          cp src-tauri/target/release/tidyfiles "${PKG_DIR}/usr/lib/tidyfiles/tidyfiles-bin"
          chmod +x "${PKG_DIR}/usr/lib/tidyfiles/tidyfiles-bin"

          # Create launcher script with WebKit fixes
          cat > "${PKG_DIR}/usr/bin/tidyfiles" <<'LAUNCHER'
          #!/bin/bash
          # Launcher script with WebKit rendering fixes for Arch Linux

          # Check for required dependencies
          if ! ldconfig -p | grep -q libwebkit2gtk-4.1.so; then
              echo "Error: Missing required dependency 'webkit2gtk'"
              echo ""
              echo "Please install it with:"
              echo "  sudo pacman -S webkit2gtk gtk3"
              echo ""
              echo "Then run tidyfiles again."
              exit 1
          fi

          # Fix blank screen issues on Wayland/Hyprland
          export GDK_BACKEND=x11

          # Disable GPU compositing (fixes most rendering issues)
          export WEBKIT_DISABLE_COMPOSITING_MODE=1

          # Additional WebKit fixes
          export WEBKIT_DISABLE_DMABUF_RENDERER=1

          # Run the actual binary
          exec /usr/lib/tidyfiles/tidyfiles-bin "$@"
          LAUNCHER
          chmod +x "${PKG_DIR}/usr/bin/tidyfiles"

          # Create desktop entry
          cat > "${PKG_DIR}/usr/share/applications/tidyfiles.desktop" <<EOF
          [Desktop Entry]
          Name=TidyFiles
          Comment=Organize your files efficiently
          Exec=tidyfiles
          Icon=tidyfiles
          Type=Application
          Categories=Utility;FileTools;
          Terminal=false
          EOF

          # Copy icon (using a placeholder for now, will update with actual icon)
          touch "${PKG_DIR}/usr/share/pixmaps/tidyfiles.png"

          # Create .PKGINFO
          cat > "${PKG_DIR}/.PKGINFO" <<EOF
          pkgname = tidyfiles
          pkgver = ${PKG_VERSION}-1
          pkgdesc = Organize your files efficiently with custom rules and smart features
          url = https://github.com/wihlarkop/tidyfiles
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb "${PKG_DIR}" | cut -f1)
          arch = x86_64
          license = MIT
          depend = webkit2gtk
          depend = gtk3
          EOF

          # Create package using zstd compression
          cd "${PKG_DIR}"

          # Create the package archive with all files including .PKGINFO
          tar --zstd -cf ../tidyfiles-${PKG_VERSION}-1-x86_64.pkg.tar.zst .PKGINFO usr/

          cd ..

          echo "Arch package created: tidyfiles-${PKG_VERSION}-1-x86_64.pkg.tar.zst"
          ls -lh tidyfiles-${PKG_VERSION}-1-x86_64.pkg.tar.zst

      - name: Upload Arch Package
        shell: bash
        run: |
          ARCH_FILE=$(find . -maxdepth 1 -name "tidyfiles-*-x86_64.pkg.tar.zst" -type f | head -n 1)
          if [ -n "$ARCH_FILE" ]; then
            gh release upload v${{ needs.create-release.outputs.version }} "$ARCH_FILE" --clobber
          else
            echo "No Arch package found"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-update-manifest:
    name: Generate Update Manifest
    needs: [create-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Get release assets
        shell: bash
        run: |
          gh release view v${{ needs.create-release.outputs.version }} --repo wihlarkop/tidyfiles --json assets -q '.assets[].name' > assets.txt
          cat assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate update manifest
        shell: bash
        run: |
          # Get asset names
          NSIS_FILE=$(grep -E '.*-setup\.exe$' assets.txt | head -n 1)
          DMG_FILE=$(grep -E '.*\.dmg$' assets.txt | head -n 1)
          APPIMAGE_FILE=$(grep -E '.*\.AppImage$' assets.txt | head -n 1)

          cat > latest.json << EOF
          {
            "version": "${{ needs.create-release.outputs.version }}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${NSIS_FILE}",
                "signature": ""
              },
              "darwin-universal": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${DMG_FILE}",
                "signature": ""
              },
              "linux-x86_64": {
                "url": "https://github.com/wihlarkop/tidyfiles/releases/download/v${{ needs.create-release.outputs.version }}/${APPIMAGE_FILE}",
                "signature": ""
              }
            }
          }
          EOF
          cat latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest
        shell: bash
        run: |
          gh release upload v${{ needs.create-release.outputs.version }} latest.json --clobber --repo wihlarkop/tidyfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
