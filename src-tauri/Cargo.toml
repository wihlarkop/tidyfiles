[package]
name = "tidyfiles"
version = "0.1.0"
description = "TidyFiles - Automatically organize your files with custom rules and smart features"
authors = ["Edo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tidyfiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1.10"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"

# Optimize build profiles for faster compilation
[profile.dev]
incremental = true
opt-level = 1  # Minimal optimization for faster debug builds

[profile.release]
opt-level = "z"  # Optimize for size (also faster linking)
strip = true  # Strip symbols for smaller binaries
lto = "thin"  # Thin LTO for faster linking while keeping good optimization
codegen-units = 1  # Better optimization at cost of compile time
panic = "abort"  # Smaller binary, no unwinding
